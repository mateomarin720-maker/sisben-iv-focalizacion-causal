# Catálogo de fuentes de datos — Proyecto Sisbén IV / Inferencia causal
#
# Este archivo documenta trazabilidad, tipo de acceso y estado de gestión
# de cada fuente usada para la contrastación (GEIH, Sisbén IV, DPS, IPM,
# RUI), siguiendo el mismo patrón de catálogo empleado en el proyecto
# hermano `desarrollo_social_y_economico` (data/catalogo.yaml).
#
# Estado: pendiente | en_gestion | disponible
# Acceso: abierto | registro | solicitud_institucional

fuentes:

  - id: geih
    nombre: "Gran Encuesta Integrada de Hogares"
    entidad: DANE
    portal: "microdatos.dane.gov.co"
    catalogo_ref: null  # completar con número de catálogo tras registro
    periodo: "2024 (mensual, 12 archivos)"
    unidad_analisis: hogar / persona
    acceso: registro
    estado: disponible
    notas: >
      Verificado 2026-08-09: descarga manual desde microdatos.dane.gov.co,
      previo registro gratuito (microdato PÚBLICO, no requiere solicitud
      institucional a diferencia de Sisbén). Se entrega en archivos
      mensuales (Ene_2024.zip ... Dic_2024.zip), cada uno con 8 módulos
      en 3 formatos (DTA/SAV/CSV): "Datos del hogar y la vivienda"
      (nivel hogar), "Características generales...", "Fuerza de
      trabajo", "Ocupados", "No ocupados", "Otras formas de trabajo",
      "Otros ingresos e impuestos", "Migración" (estos 7 a nivel
      persona). Depositados localmente en
      data/0_raw/geih/2024/{01..12}/CSV/*.CSV (NO versionado en git —
      ver .gitignore).
      Llave de hogar: DIRECTORIO + SECUENCIA_P + HOGAR (verificado
      único en enero 2024: 24.247 hogares, 0 duplicados, 33
      departamentos representados). Llave de persona: se agrega ORDEN.
      Nota de nomenclatura: NO usa SECUENCIA_ENCUESTA como el IPM — es
      SECUENCIA_P directamente, distinto de la convención IPM.

      Validación de integridad 2024-08-09 (12/12 meses, ver
      src/utils/validar_geih.py y docs/reports/reporte_*_geih.csv):
      corregidos 2 bugs de ingesta que dejaban meses sin procesar —
      geih_loader.py tomaba solo la primera carpeta "CSV" encontrada por
      rglob (algunos meses traen carpetas "CSV" vacías/decoy junto a la
      real, según cómo se descomprimió el ZIP), lo que hacía fallar
      marzo y abril completos; y el prefijo "No ocupados" no matcheaba
      "No ocupado.CSV" (marzo viene en singular). Agosto 2024 solo trae
      1/8 módulos en CSV en el origen (el resto vino vacío en la
      descarga) — se agregó fallback a .DTA (parse_stata_a_parquet) para
      los 7 módulos restantes, marcados con `_source_format=dta_fallback`
      en el parquet para trazabilidad.
      Resultado tras las correcciones: 12/12 meses con 8/8 módulos, 0
      duplicados de llave hogar en ningún mes, 33/33 departamentos
      representados en todos los meses. Representatividad: hogares
      expandidos (suma FEX_C18) crece de forma suave y monótona de
      17.69M (enero) a 18.12M (diciembre), sin saltos anómalos; % de
      hogares en cabecera municipal estable en 78.3-78.4% todo el año —
      ambos son señales de consistencia interna, no de sesgo. Error
      muestral: el microdato público NO trae variables de diseño
      (estrato/UPM), así que solo se pudo calcular un error naíve bajo
      supuesto SRS (~0.25-0.3 pp de error estándar para una proporción
      cercana a 78%) — es una COTA INFERIOR; el error real de GEIH bajo
      su diseño complejo estratificado-conglomerado es mayor (deff > 1,
      no cuantificable sin las variables de diseño). Para error oficial
      usar los anexos de indicadores de DANE.
    diccionario_variables:
      identificadores:
        DIRECTORIO: "Identificador de hogar (segmento muestral)"
        SECUENCIA_P: "Secuencia del hogar dentro del directorio"
        HOGAR: "Número de hogar dentro de la vivienda"
        ORDEN: "Orden de la persona dentro del hogar (módulos de persona)"
        FEX_C18: "Factor de expansión"
        DPTO: "Código de departamento (33 valores, incl. dominios especiales)"
      vivienda_comunes_con_ipm:
        P4010: "Tipo de vivienda"
        P4020: "Material predominante paredes exteriores"
        P4030S1: "Material predominante pisos"
        P5010: "Número de cuartos"
        P5020: "Cuartos usados para dormir (insumo hacinamiento)"
    variables_clave:
      - ingreso_percapita
      - condicion_ocupacion
      - informalidad_laboral
      - composicion_hogar
      - p4010
      - p4020
      - p5010
      - p5020

  - id: sisben_iv
    nombre: "Sisbén IV — Registro Social de Hogares"
    entidad: DNP
    portal: "sisben.gov.co (solicitud académica ante DNP)"
    catalogo_ref: null
    periodo: "Nacional: corte mayo 2024 (ANDA-DNP). Bogotá: corte 03/08/2026 (SDP)"
    unidad_analisis: hogar
    acceso: solicitud_institucional
    estado: disponible
    notas: >
      Microdato anonimizado obtenido vía ANDA-DNP (nacional, 1.833.166
      hogares) y por solicitud a la SDP (Bogotá, 1.458.468 hogares; el
      Distrito administra su Sisbén aparte). Variable de tratamiento: grupo
      (A/B/C/D), nivel y clasificación; el extracto no trae puntaje
      continuo. La edad del jefe viene como código de ciclo de vida
      (ver docs/DICCIONARIO_HOTDECK.md).
    variables_clave:
      - grupo_elegibilidad
      - clasificacion
      - zona
      - departamento

  - id: dps
    nombre: "Registros de programas de transferencias (DPS)"
    entidad: "Departamento para la Prosperidad Social"
    portal: "prosperidadsocial.gov.co"
    catalogo_ref: null
    periodo: "2023 (según disponibilidad)"
    unidad_analisis: hogar / persona
    acceso: solicitud_institucional
    estado: pendiente
    notas: >
      Beneficiarios de Familias en Acción, Jóvenes en Acción, Colombia
      Mayor e Ingreso Solidario. Permite vincular elegibilidad formal
      con participación real en programas.
    variables_clave:
      - beneficiario_familias_accion
      - beneficiario_ingreso_solidario

  - id: ipm
    nombre: "Índice de Pobreza Multidimensional"
    entidad: DANE
    portal: "microdatos.dane.gov.co (descarga manual, registro requerido)"
    catalogo_ref: null  # el dataset de datos.gov.co (ntk3-fdqa) NO tiene API tabular habilitada (error Socrata: "no row or column access to non-tabular tables"); descartado.
    catalogo_ref_por_anio: {}
    periodo: "2024-2025"
    unidad_analisis: hogar (indicadores agregados también disponibles)
    acceso: registro
    estado: disponible
    notas: >
      Verificado 2026-08-04: descarga manual desde
      microdatos.dane.gov.co/index.php/catalog/903, previo registro
      gratuito. Trae 6 archivos (Hogares/Personas/Viviendas x
      Nacional/Departamental), depositados en
      data/0_raw/ipm/{nacional,departamental}/{hogares,personas,viviendas}.csv.
      Procesados por src/1_integracion.py vía ARCHIVOS_LOCALES.
      Hogares nacional: 79.125 filas, tasa de pobreza (POBRE=1): ~13.0%,
      IPM promedio 0.195 (rango 0.0-0.86).
    diccionario_variables:
      # Nombres técnicos reales, extraídos del DDI XML oficial
      # (DANE-DIMPE-POBREZA-MULTIDIMENSIONAL-2025.xml, 146 variables).
      # NOTA: el DDI describe VARIAS bases relacionadas (hogar/persona,
      # nacional/departamental) bajo el mismo <dataDscr>; hay nombres
      # repetidos con mayúscula distinta (ej. IPM vs ipm, FEX_C vs fex_c)
      # porque corresponden a archivos de datos diferentes dentro del
      # mismo estudio — confirmar el nombre exacto por archivo cuando se
      # descargue la base real (no solo la ficha DDI).
      identificadores:
        DIRECTORIO: "Identificador de hogar"
        SECUENCIA_ENCUESTA: "Secuencia de la encuesta"
        SECUENCIA_P: "Secuencia de persona"
        FEX_C: "Factor de expansión (hogar)"
        FEXP: "Factor de expansión (personas)"
      privaciones_15:
        logro_educativo: "Privación por bajo logro educativo"
        analfabetismo: "Privación por analfabetismo"
        inasistencia_escolar: "Privación por inasistencia escolar"
        rezago_escolar: "Privación por rezago escolar"
        atencion_integral: "Privación por barreras de acceso a atención integral primera infancia"
        trabajo_infantil: "Privación por trabajo infantil"
        desempleo_larga_duracion: "Privación por desempleo de larga duración"
        empleo_formal: "Privación por tasa de empleo formal (informalidad)"
        aseguramiento_salud: "Privación por no aseguramiento en salud"
        barreras_acceso_salud: "Privación por barreras de acceso a salud"
        acueducto: "Privación por no acceso a fuente de agua mejorada"
        alcantarillado: "Privación por inadecuada eliminación de excretas"
        pisos: "Privación por material inadecuado de pisos"
        paredes: "Privación por material inadecuado de paredes exteriores"
        hacinamiento: "Privación por hacinamiento crítico"
      resultado:
        ipm: "Índice de Pobreza Multidimensional (suma ponderada de privaciones)"
        pobre: "Hogar clasificado como pobre (IPM >= 5/15)"
    variables_clave:
      # Lista plana para uso rápido en scripts (ver diccionario_variables
      # arriba para el detalle y las notas de identificadores/factores
      # de expansión).
      - ipm
      - pobre
      - logro_educativo
      - analfabetismo
      - inasistencia_escolar
      - rezago_escolar
      - atencion_integral
      - trabajo_infantil
      - desempleo_larga_duracion
      - empleo_formal
      - aseguramiento_salud
      - barreras_acceso_salud
      - acueducto
      - alcantarillado
      - pisos
      - paredes
      - hacinamiento

  - id: rui
    nombre: "Registro Único de Víctimas"
    entidad: "Unidad para las Víctimas (UARIV)"
    portal: "unidadvictimas.gov.co"
    catalogo_ref: null
    periodo: vigente
    unidad_analisis: persona / hogar
    acceso: solicitud_institucional
    estado: pendiente
    notas: >
      Fuera del alcance replanteado (por confirmar con el tutor). Si se
      incorpora, se usaría como covariable de control (condición de víctima
      del conflicto armado); requiere convenio o solicitud institucional.
    variables_clave:
      - condicion_victima

# Estrategia de vinculación: no existe llave común entre GEIH y Sisbén IV,
# por lo que se usa emparejamiento estadístico (Hot-Deck) por celdas de
# departamento + ciclo de vida del jefe de hogar (la GEIH no desagrega a
# nivel municipal). Ver docs/DICCIONARIO_HOTDECK.md y
# src/emparejamiento/emparejamiento_hotdeck_geih_sisben.py.
