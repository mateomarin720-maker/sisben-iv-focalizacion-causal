[tool.poetry]
name = "sisben_causal"
version = "0.1.0"
description = "Inferencia causal sobre la clasificación en el Sisbén IV — Proyecto de grado, Maestría en Ciencia de Datos, USTA."
authors = [
    "Juan Sebastián Fonseca Arévalo <tu.email@usantotomas.edu.co>",
    "José Mateo Roncancio Marín <tu.email@usantotomas.edu.co>"
]
license = "MIT"
readme = "README.md"
# El repo son scripts en src/ (1_integracion.py, 2_limpieza.py, ...), no
# una librería empaquetable con __init__.py — sin esto Poetry intenta
# instalar "sisben_causal" como paquete y falla con "No file/folder
# found for package sisben-causal". package-mode=false le dice a Poetry
# que solo gestione dependencias, sin empaquetar el proyecto en sí.
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
# Manipulación y E/S de datos
pandas = "^2.2.0"
numpy = "^2.0.0"
pyarrow = "^16.0.0"
requests = "^2.31.0"
pyyaml = "^6.0"
python-dotenv = "^1.0.0"
openpyxl = "^3.1"  # leer los diccionarios oficiales de variables (.xlsx) en docs/insumos/
#
# Modelado base
scikit-learn = ">=1.9.0,<2.0.0"
scipy = "^1.15"  # scipy.stats.spearmanr en seleccion_variables_lasso_shap.py (viene como dependencia transitiva de sklearn, se declara explícita)
#
# Inferencia causal
econml = "^0.17"
networkx = "^3.2"
#
# Visualización
matplotlib = "^3.8"
# econml importa shap internamente (SHAP values para CATE); <0.46 no es
# compatible con numpy 2.x (AttributeError np.obj2sctype removido, verificado
# 2026-10-21). econml 0.17 también requirió subir scikit-learn (ver arriba).
shap = ">=0.51,<1.0"
#
# Banco de datos
azure-storage-blob = "^12.30.3"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
ruff = "^0.3"

# `poetry run pytest` usa el ejecutable de pytest, que no pone la raíz del
# repositorio en el path: sin esto, las pruebas que importan `src.*` no
# cargan (5 archivos fallaban; `python -m pytest` sí la pone).
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
