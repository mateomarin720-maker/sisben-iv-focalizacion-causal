# Corre las pruebas en cada push a las dos ramas de trabajo y en cada PR.
# Las pruebas que necesitan el banco de datos (Azure) se saltan solas: aquí
# corren las que usan datos sintéticos y los diccionarios versionados.
# Detalle de qué cubre cada una: tests/README.md.
name: Pruebas

on:
  push:
    branches: [main, ediciones-hotdeck-sdp]
  pull_request:
  workflow_dispatch:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # la prueba de mutación (53 errores) pasa de 30 minutos
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Los commits van a nombre de las personas del equipo (.githooks/commit-msg).
      - name: Autoría de los commits
        run: |
          if git log --format='%an <%ae>%n%cn <%ce>%n%B' | grep -inE 'noreply@anthropic\.com|^claude-session:|^co-authored-by:.*claude|generated with \[?claude code'; then
            echo "::error title=autoria::Hay commits con autoría o coautoría de Claude"
            exit 1
          fi

      - name: Instalar Poetry
        run: pipx install poetry

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: poetry

      - name: Instalar dependencias (versiones de poetry.lock)
        run: poetry install --no-root

      # Cada prueba fallida queda también como anotación del job (visible
      # sin permisos sobre los registros).
      - name: Pruebas
        run: |
          set -o pipefail
          poetry run python -m pytest tests/ -q -rs -rf 2>&1 | tee pytest.log || {
            grep -E "^(FAILED|ERROR) " pytest.log | sed 's/^/::error title=pytest::/'
            exit 1
          }

      # Reintroduce cada error ya documentado y exige que alguna prueba falle.
      - name: Prueba de mutación
        run: poetry run python tests/mutaciones.py
